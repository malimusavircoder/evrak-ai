<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Yakit Fisi Kontrolu</title>
    <meta name="theme-color" content="#0f766e">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <style>
        :root { --surface: rgba(255,253,248,.94); --ink: #1f2937; --muted: #6b7280; --line: #ded7cb; --accent: #0f766e; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 30%), linear-gradient(180deg, #f8f4ec 0%, #efe5d7 100%); color: var(--ink); }
        .shell { max-width: 1080px; margin: 0 auto; padding: 18px 16px 32px; }
        .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
        .topbar a { color: var(--accent); text-decoration: none; font-weight: 700; }
        .grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 18px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 12px 32px rgba(52, 42, 26, 0.08); }
        .preview { width: 100%; min-height: 420px; object-fit: contain; border: 1px solid var(--line); border-radius: 14px; background: #f8f8f8; }
        .meta, .ocr-box { color: var(--muted); font-size: 14px; line-height: 1.6; }
        .ocr-box { margin-top: 14px; padding: 14px; border-radius: 14px; background: #faf7f2; border: 1px dashed var(--line); max-height: 220px; overflow: auto; white-space: pre-wrap; }
        form { display: grid; gap: 12px; }
        label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--line); background: white; font: inherit; }
        textarea { min-height: 86px; resize: vertical; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
        button, .button-link { border: none; border-radius: 999px; padding: 13px 18px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
        .primary { background: linear-gradient(135deg, var(--accent) 0%, #0b5d57 100%); color: white; }
        .secondary { background: #ece7de; color: var(--ink); }
        @media (max-width: 860px) { .grid, .field-row { grid-template-columns: 1fr; } .preview { min-height: 280px; } }
    </style>
</head>
<body>
    <div class="shell">
        <div class="topbar">
            <a href="/fuel">Yeni yakit fisi</a>
            <a href="/fuel-records">Kayitlara git</a>
        </div>
        <div class="grid">
            <section class="card">
                <h1>Fis onizleme</h1>
                <div class="meta">Musteri: <strong>{{ musteri }}</strong><br>Dosya: <strong>{{ dosya_adi }}</strong></div>
                <img class="preview" src="{{ dosya_url }}" alt="Yuklenen yakit fisi">
                <div class="ocr-box">{{ result.ocr_metin or "OCR metni bulunamadi." }}</div>
            </section>
            <section class="card">
                <h2>Alanlari kontrol et</h2>
                <form action="/fuel/save" method="post">
                    <input type="hidden" name="musteri" value="{{ musteri }}">
                    <input type="hidden" name="dosya_adi" value="{{ dosya_adi }}">
                    <input type="hidden" name="dosya_yolu" value="{{ dosya_yolu }}">
                    <input type="hidden" name="ocr_metin" value="{{ result.ocr_metin }}">
                    <div class="field-row">
                        <div><label for="istasyon_adi">Istasyon</label><input id="istasyon_adi" name="istasyon_adi" value="{{ result.istasyon_adi }}"></div>
                        <div><label for="vergi_no">Vergi no</label><input id="vergi_no" name="vergi_no" value="{{ result.vergi_no }}"></div>
                    </div>
                    <div class="field-row">
                        <div><label for="tarih">Tarih</label><input id="tarih" name="tarih" value="{{ result.tarih }}" placeholder="YYYY-MM-DD"></div>
                        <div><label for="saat">Saat</label><input id="saat" name="saat" value="{{ result.saat }}" placeholder="HH:MM"></div>
                    </div>
                    <div class="field-row">
                        <div><label for="fis_no">Fis no</label><input id="fis_no" name="fis_no" value="{{ result.fis_no }}"></div>
                        <div><label for="plaka">Plaka</label><input id="plaka" name="plaka" value="{{ result.plaka }}"></div>
                    </div>
                    <div class="field-row">
                        <div><label for="litre">Litre</label><input id="litre" name="litre" inputmode="decimal" value="{{ result.litre }}"></div>
                        <div><label for="birim_fiyat">Birim fiyat</label><input id="birim_fiyat" name="birim_fiyat" inputmode="decimal" value="{{ result.birim_fiyat }}"></div>
                    </div>
                    <div class="field-row">
                        <div><label for="kdv_tutari">KDV tutari</label><input id="kdv_tutari" name="kdv_tutari" inputmode="decimal" value="{{ result.kdv_tutari }}"></div>
                        <div><label for="toplam">Toplam</label><input id="toplam" name="toplam" inputmode="decimal" value="{{ result.toplam }}"></div>
                    </div>
                    <div class="field-row">
                        <div><label for="odeme_tipi">Odeme tipi</label><input id="odeme_tipi" name="odeme_tipi" value="{{ result.odeme_tipi }}"></div>
                        <div><label for="durum">Durum</label><select id="durum" name="durum"><option value="Onaylandi" selected>Onaylandi</option><option value="Kontrol">Kontrol</option></select></div>
                    </div>
                    <div><label for="aciklama">Aciklama</label><textarea id="aciklama" name="aciklama">{{ result.aciklama }}</textarea></div>
                    <div class="actions"><button class="primary" type="submit">Kaydi tamamla</button><a class="button-link secondary" href="/fuel">Vazgec</a></div>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
